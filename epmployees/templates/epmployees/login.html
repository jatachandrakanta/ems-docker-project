<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(to right, #4facfe, #00f2fe);
        }

        .login-box{
            width:350px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.2);
        }

        .login-box h2{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            font-size:16px;
        }

        .input-box input:focus{
            border-color:#4facfe;
        }

        .login-btn{
            width:100%;
            padding:12px;
            border:none;
            background:#4facfe;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
            transition:0.3s;
        }

        .login-btn:hover{
            background:#00c6fb;
        }

        .register-link{
            text-align:center;
            margin-top:20px;
        }

        .register-link a{
            text-decoration:none;
            color:#4facfe;
            font-weight:bold;
        }

    </style>

</head>
<body>

    <div class="login-box">

        <h2>Employee Management System</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="input-box">
                <input type="text" name="username" placeholder="Enter Username" required>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </div>

    </div>

</body>
</html>
