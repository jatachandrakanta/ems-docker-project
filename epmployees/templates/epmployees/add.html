{% extends 'epmployees/base.html' %}

{% block content %}

<h2>Add / Update Employee</h2>

<form method="POST" class="card p-4 shadow-sm">
    {% csrf_token %}

    <input type="text" name="name" class="form-control mb-2" placeholder="Name" value="{{ employee.name }}">
    <input type="email" name="email" class="form-control mb-2" placeholder="Email" value="{{ employee.email }}">
    <input type="text" name="department" class="form-control mb-2" placeholder="Department" value="{{ employee.department }}">
    <input type="number" name="salary" class="form-control mb-2" placeholder="Salary" value="{{ employee.salary }}">

    <button type="submit" class="btn btn-primary">Save</button>
</form>

{% endblock %}
